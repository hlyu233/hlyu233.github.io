<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的直播页</title>
  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
    }
    .wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    h1 {
      margin: 0 0 16px;
      font-size: 28px;
    }
    p {
      margin: 0 0 24px;
      font-size: 16px;
      color: #ccc;
      line-height: 1.6;
    }
    .btn {
      display: inline-block;
      padding: 14px 28px;
      background: #ff2d55;
      color: #fff;
      text-decoration: none;
      border-radius: 10px;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>欢迎来到我的直播间</h1>
    <p>这是我的 H5 落地页<br>下一步我们把直播接进来</p>
    <a href="#" class="btn">直播即将开始</a>
  </div>
</body>
</html>
